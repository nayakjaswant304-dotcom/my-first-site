<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%93</text></svg>">
<title>Page Not Found | Multi-Topic Study Hub</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5;
  --accent:#1a73e8;
  --accent-dark:#0f5bc4;
  --card-bg:#edf1f8;
  --text:#20242c;
  --muted:#5f6b7a;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%,rgba(26,115,232,0.14),transparent 45%),
    radial-gradient(circle at 85% 15%,rgba(255,138,101,0.14),transparent 45%),
    radial-gradient(circle at 50% 95%,rgba(46,164,79,0.10),transparent 50%),
    linear-gradient(160deg,#eef2f8,#e3e9f2 60%,#dbe3ee);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 16px;
}
.app-card{
  width:100%;
  max-width:500px;
  background:var(--card-bg);
  border-radius:18px;
  box-shadow:0 20px 45px rgba(20,30,60,0.14),0 2px 8px rgba(20,30,60,0.06);
  padding:48px 32px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.app-card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:5px;
  background:linear-gradient(90deg,var(--accent),#6fa8ff,#ff8a65);
}
.error-code{
  font-family:"Poppins",sans-serif;
  font-size:4.5rem;
  font-weight:800;
  color:var(--accent);
  margin:0 0 8px;
  line-height:1;
}
h1{font-family:"Poppins","Inter",sans-serif;font-size:1.3rem;margin:0 0 10px;}
p{color:var(--muted);font-size:0.95rem;margin:0 0 28px;line-height:1.5;}
.btn{
  display:inline-block;
  border:none;
  border-radius:10px;
  padding:12px 24px;
  font-size:1rem;
  font-weight:600;
  background:var(--accent);
  color:#fff;
  text-decoration:none;
  transition:background 0.2s ease,transform 0.15s ease;
}
.btn:hover{background:var(--accent-dark);transform:translateY(-1px);}
</style>
</head>
<body>

<div class="app-card">
  <div class="error-code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back to studying.</p>
  <a class="btn" href="/">&larr; Back to Study Hub</a>
</div>

</body>
</html>
